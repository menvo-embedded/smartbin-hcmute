; Firmware THỬ NGUỒN cho 3 servo (không BLE). Nạp để kiểm tra chân VIN có kéo
; nổi 3 servo không, rồi nạp lại firmware chính trong ../esp32-bin.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
upload_speed = 115200
