; Firmware ESP32 cho SmartBin — GATT server BLE khớp giao thức trong
; src/core/ble/binController.ts (app React Native).
;
; Board mặc định là "esp32dev" (ESP32-WROOM-32 devkit phổ biến). Nếu bạn dùng
; board khác (ESP32-S3, ESP32-C3...) đổi giá trị `board` cho đúng.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^6.21.5
